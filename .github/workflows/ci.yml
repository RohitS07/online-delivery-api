# The same checks as `make lint-api typecheck-api test-api` in the workspace (RULE-0019).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Format, lint and types before the tests.
      - run: dotnet format OnlineDelivery.sln --verify-no-changes
      - run: dotnet build OnlineDelivery.sln -warnaserror --nologo
      - run: dotnet test OnlineDelivery.sln --no-build --nologo
